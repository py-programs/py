<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Python Programs | Terminal</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111;
            --primary: #00ff00;
            --secondary: #0f0;
            --text: #00cc00;
            --text-dim: #009900;
            --border: #00ff00;
            --hover: #1a1a1a;
            --success: #00ff00;
            --danger: #ff3333;
            --glitch: #00ffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* CRT scanlines overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 255, 0, 0.02) 0px,
                    rgba(0, 255, 0, 0.02) 1px,
                    transparent 1px,
                    transparent 2px);
            pointer-events: none;
            z-index: 9999;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 2rem 1rem;
            border-bottom: 2px solid var(--border);
            margin-bottom: 2rem;
            position: relative;
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--primary);
            text-shadow: 0 0 10px var(--glitch), 0 0 20px var(--primary);
            position: relative;
            display: inline-block;
            animation: glitch 1.5s infinite;
        }

        @keyframes glitch {
            0%,
            100% {
                text-shadow: 0 0 10px var(--glitch), 0 0 20px var(--primary);
            }
            92% {
                text-shadow: 0 0 10px var(--glitch), 0 0 20px var(--primary);
            }
            93% {
                text-shadow: -2px 0 red, 2px 0 blue;
            }
            94% {
                text-shadow: 2px 0 red, -2px 0 blue;
            }
            95% {
                text-shadow: 0 0 10px var(--glitch), 0 0 20px var(--primary);
            }
            96% {
                text-shadow: -1px 0 cyan, 1px 0 magenta;
            }
            97% {
                text-shadow: 0 0 10px var(--glitch), 0 0 20px var(--primary);
            }
        }

        .subtitle {
            color: var(--text-dim);
            margin-top: 0.5rem;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .search-bar {
            width: 100%;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0.8rem 1.2rem;
            background: #000;
            border: 2px solid var(--border);
            border-radius: 0;
            color: var(--primary);
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            display: block;
            caret-color: var(--primary);
            transition: box-shadow 0.2s;
        }
        .search-bar:focus {
            outline: none;
            box-shadow: 0 0 15px var(--glitch), inset 0 0 5px var(--primary);
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .cat-btn {
            background: #000;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 0.5rem 1.2rem;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        .cat-btn:hover,
        .cat-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: #0d0d0d;
            border: 1px solid var(--border);
            padding: 1.5rem;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            position: relative;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.2);
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px var(--glitch), 0 0 30px rgba(0, 255, 0, 0.3);
            border-color: var(--glitch);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
        }

        .card-desc {
            color: var(--text-dim);
            font-size: 0.85rem;
            flex-grow: 1;
        }

        .code-preview {
            background: #000;
            padding: 0.8rem;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            overflow-x: auto;
            white-space: pre-wrap;
            color: #00cc00;
            max-height: 100px;
            border: 1px solid #333;
            border-radius: 0;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 0.6rem 1rem;
            border-radius: 0;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        .btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 10px var(--primary);
        }
        .btn-outline {
            border: 1px dashed var(--primary);
        }
        .btn-copy {
            background: #002200;
            border-color: var(--success);
            color: var(--success);
        }
        .btn-copy:hover {
            background: var(--success);
            color: #000;
            box-shadow: 0 0 15px var(--success);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #000;
            border: 1px solid var(--success);
            color: var(--success);
            padding: 0.8rem 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 10000;
            box-shadow: 0 0 15px var(--success);
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal {
            background: #0a0a0a;
            border: 2px solid var(--primary);
            padding: 2rem;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 30px var(--glitch);
            position: relative;
        }
        .modal h2 {
            margin-bottom: 1rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .modal .code-block {
            background: #000;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            overflow-x: auto;
            border: 1px solid #333;
            margin: 1rem 0;
            color: #00cc00;
        }
        .modal-close {
            float: right;
            background: none;
            border: none;
            color: var(--primary);
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }
        .modal-url {
            background: #000;
            border: 1px solid var(--border);
            padding: 0.5rem;
            font-family: monospace;
            word-break: break-all;
            margin: 0.5rem 0;
            color: var(--glitch);
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 2rem;
            }
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🐍 Master_Python //</div>
            <p class="subtitle">> Fetch .py files remotely. Execute with exec().</p>
        </header>

        <input type="text" class="search-bar" id="searchInput" placeholder="Search programs...">

        <div class="categories" id="categoryButtons">
            <!-- dynamically filled -->
        </div>

        <div class="grid" id="programGrid"></div>
    </div>

    <div class="toast" id="toast">[+] URL copied to clipboard</div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" id="modalClose">&times;</button>
            <h2 id="modalTitle"></h2>
            <p id="modalDesc" style="color:var(--text-dim)"></p>
            <div class="modal-url" id="modalUrl"></div>
            <button class="btn btn-copy" id="modalCopyBtn">[ Copy URL ]</button>
            <div class="code-block" id="modalCode"></div>
        </div>
    </div>

    <script>
        let programs = [];
        let categories = new Set();

        async function loadPrograms() {
            try {
                const response = await fetch('programs.json');
                if (!response.ok) throw new Error('Failed to load programs.json');
                programs = await response.json();
                categories = new Set(programs.map(p => p.category).filter(Boolean));
                setupCategories();
                renderPrograms(programs);
            } catch (err) {
                document.getElementById('programGrid').innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;color:var(--danger);padding:2rem;">
                        [!] Could not load programs.json. Check file.
                    </div>`;
                console.error(err);
            }
        }

        function setupCategories() {
            const container = document.getElementById('categoryButtons');
            container.innerHTML = '<button class="cat-btn active" data-category="all">ALL</button>';
            [...categories].sort().forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.setAttribute('data-category', cat);
                btn.textContent = cat;
                container.appendChild(btn);
            });

            container.addEventListener('click', (e) => {
                if (e.target.classList.contains('cat-btn')) {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    const cat = e.target.getAttribute('data-category');
                    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                    filterAndRender(cat, searchTerm);
                }
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function renderPrograms(filteredProgs) {
            const grid = document.getElementById('programGrid');
            grid.innerHTML = '';
            if (filteredProgs.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text-dim)">[ No programs found ]</div>';
                return;
            }
            filteredProgs.forEach(prog => {
                const preview = prog.code ? prog.code.slice(0, 150) : '# No preview';
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-title">> ${escapeHtml(prog.title)}</div>
                    <div class="card-desc">${escapeHtml(prog.desc || '')}</div>
                    <div class="code-preview">${escapeHtml(preview)}</div>
                    <div class="btn-group">
                        <button class="btn btn-copy copy-btn" data-file="${escapeHtml(prog.file)}">[Copy URL]</button>
                        <button class="btn btn-outline view-btn" data-title="${escapeHtml(prog.title)}" data-desc="${escapeHtml(prog.desc || '')}" data-file="${escapeHtml(prog.file)}" data-code="${escapeHtml(prog.code || '')}">[View]</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            attachCardEvents();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => showToast('[+] URL copied to clipboard'));
        }

        function attachCardEvents() {
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const file = btn.getAttribute('data-file');
                    const base = window.location.href.replace(/\/[^/]*$/, '');
                    const fullUrl = `${base}/programs/${file}`;
                    copyToClipboard(fullUrl);
                });
            });

            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const title = btn.getAttribute('data-title');
                    const desc = btn.getAttribute('data-desc');
                    const file = btn.getAttribute('data-file');
                    const code = btn.getAttribute('data-code');
                    openModal(title, desc, file, code);
                });
            });
        }

        function openModal(title, desc, file, code) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalDesc').textContent = desc;
            const base = window.location.href.replace(/\/[^/]*$/, '');
            document.getElementById('modalUrl').textContent = `${base}/programs/${file}`;
            document.getElementById('modalCode').textContent = code;
            document.getElementById('modalOverlay').classList.add('active');

            document.getElementById('modalCopyBtn').onclick = () => {
                const url = document.getElementById('modalUrl').textContent;
                copyToClipboard(url);
            };
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const activeCat = document.querySelector('.cat-btn.active')?.getAttribute('data-category') || 'all';
            filterAndRender(activeCat, searchTerm);
        });

        function filterAndRender(category, searchTerm) {
            let filtered = programs;
            if (category !== 'all') {
                filtered = filtered.filter(p => p.category === category);
            }
            if (searchTerm) {
                filtered = filtered.filter(p =>
                    p.title.toLowerCase().includes(searchTerm) ||
                    (p.desc && p.desc.toLowerCase().includes(searchTerm))
                );
            }
            renderPrograms(filtered);
        }

        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('modalOverlay').classList.remove('active');
        });
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modalOverlay')) {
                document.getElementById('modalOverlay').classList.remove('active');
            }
        });

        loadPrograms();
    </script>
</body>
</html>
