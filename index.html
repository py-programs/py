<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Python Programs | Terminal</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111;
            --primary: #00ff00;
            --secondary: #0f0;
            --text: #00cc00;
            --text-dim: #009900;
            --border: #00ff00;
            --hover: #1a1a1a;
            --success: #00ff00;
            --glitch: #00ffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 255, 0, 0.02) 0px,
                    rgba(0, 255, 0, 0.02) 1px,
                    transparent 1px,
                    transparent 2px);
            pointer-events: none;
            z-index: 9999;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 2rem 1rem;
            border-bottom: 2px solid var(--border);
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--primary);
            text-shadow: 0 0 10px var(--glitch), 0 0 20px var(--primary);
            animation: glitch 1.5s infinite;
        }

        @keyframes glitch {
            0%, 100% { text-shadow: 0 0 10px var(--glitch), 0 0 20px var(--primary); }
            92% { text-shadow: 0 0 10px var(--glitch), 0 0 20px var(--primary); }
            93% { text-shadow: -2px 0 red, 2px 0 blue; }
            94% { text-shadow: 2px 0 red, -2px 0 blue; }
            95% { text-shadow: 0 0 10px var(--glitch), 0 0 20px var(--primary); }
            96% { text-shadow: -1px 0 cyan, 1px 0 magenta; }
            97% { text-shadow: 0 0 10px var(--glitch), 0 0 20px var(--primary); }
        }

        .subtitle {
            color: var(--text-dim);
            margin-top: 0.5rem;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .search-bar {
            width: 100%;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0.8rem 1.2rem;
            background: #000;
            border: 2px solid var(--border);
            color: var(--primary);
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            display: block;
            caret-color: var(--primary);
        }
        .search-bar:focus {
            outline: none;
            box-shadow: 0 0 15px var(--glitch), inset 0 0 5px var(--primary);
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .cat-btn {
            background: #000;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 0.5rem 1.2rem;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .cat-btn:hover, .cat-btn.active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 10px var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: #0d0d0d;
            border: 1px solid var(--border);
            padding: 1.5rem;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.2);
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px var(--glitch), 0 0 30px rgba(0, 255, 0, 0.3);
            border-color: var(--glitch);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
        }

        .card-desc {
            color: var(--text-dim);
            font-size: 0.85rem;
            flex-grow: 1;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
        }

        .btn {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 0.6rem 1rem;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 10px var(--primary);
        }
        .btn-copy {
            background: #002200;
            border-color: var(--success);
            color: var(--success);
        }
        .btn-copy:hover {
            background: var(--success);
            color: #000;
            box-shadow: 0 0 15px var(--success);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #000;
            border: 1px solid var(--success);
            color: var(--success);
            padding: 0.8rem 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 10000;
            box-shadow: 0 0 15px var(--success);
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 600px) {
            .logo { font-size: 2rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🐍 Master_Python //</div>
            <p class="subtitle">> Fetch .py files remotely. exec() locally.</p>
        </header>

        <input type="text" class="search-bar" id="searchInput" placeholder="Search programs...">

        <div class="categories" id="categoryButtons"></div>

        <div class="grid" id="programGrid"></div>
    </div>

    <div class="toast" id="toast">[+] URL copied</div>

    <script>
        let programs = [];
        let categories = new Set();

        async function loadPrograms() {
            try {
                const response = await fetch('programs.json');
                if (!response.ok) throw new Error('Failed to load');
                programs = await response.json();
                categories = new Set(programs.map(p => p.category).filter(Boolean));
                setupCategories();
                renderPrograms(programs);
            } catch (err) {
                document.getElementById('programGrid').innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;color:var(--danger);padding:2rem;">
                        [!] Could not load programs.json.
                    </div>`;
            }
        }

        function setupCategories() {
            const container = document.getElementById('categoryButtons');
            container.innerHTML = '<button class="cat-btn active" data-category="all">ALL</button>';
            [...categories].sort().forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.setAttribute('data-category', cat);
                btn.textContent = cat;
                container.appendChild(btn);
            });

            container.addEventListener('click', (e) => {
                if (e.target.classList.contains('cat-btn')) {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    const cat = e.target.getAttribute('data-category');
                    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                    filterAndRender(cat, searchTerm);
                }
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function renderPrograms(filteredProgs) {
            const grid = document.getElementById('programGrid');
            grid.innerHTML = '';
            if (filteredProgs.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text-dim)">[ No programs found ]</div>';
                return;
            }
            filteredProgs.forEach(prog => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-title">> ${escapeHtml(prog.title)}</div>
                    <div class="card-desc">${escapeHtml(prog.desc || '')}</div>
                    <div class="btn-group">
                        <button class="btn btn-copy copy-btn" data-file="${escapeHtml(prog.file)}">[Copy URL]</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            attachCopyEvents();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => showToast('[+] URL copied'));
        }

        function attachCopyEvents() {
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const file = btn.getAttribute('data-file');
                    const base = window.location.href.replace(/\/[^/]*$/, '');
                    // ✅ FIXED: include /programs/ in the URL
                    const fullUrl = base + '/programs/' + file;
                    copyToClipboard(fullUrl);
                });
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const activeCat = document.querySelector('.cat-btn.active')?.getAttribute('data-category') || 'all';
            filterAndRender(activeCat, searchTerm);
        });

        function filterAndRender(category, searchTerm) {
            let filtered = programs;
            if (category !== 'all') {
                filtered = filtered.filter(p => p.category === category);
            }
            if (searchTerm) {
                filtered = filtered.filter(p =>
                    p.title.toLowerCase().includes(searchTerm) ||
                    (p.desc && p.desc.toLowerCase().includes(searchTerm))
                );
            }
            renderPrograms(filtered);
        }

        loadPrograms();
    </script>
</body>
</html>
